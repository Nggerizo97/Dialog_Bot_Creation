name: Bot_Dialog_Generator CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contracts-and-backend:
    name: Contracts & Go Services
    runs-on: ubuntu-latest
    services:
      # Real PostgreSQL for the row-level security tests and the studio-api suite.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bdg_owner
          POSTGRES_PASSWORD: bdg_owner_ci
          POSTGRES_DB: bot_dialog_generator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bdg_owner"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://bdg_owner:bdg_owner_ci@localhost:5432/postgres?sslmode=disable
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: bot_dialog_generator/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.47.2'

      - name: Buf Lint
        run: |
          cd bot_dialog_generator
          buf lint

      - name: Verify Code Generation
        run: |
          cd bot_dialog_generator
          buf generate
          git diff --exit-code libs/

      - name: Verify Formatting (gofmt)
        run: |
          cd bot_dialog_generator
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Go Vet
        run: |
          cd bot_dialog_generator
          go vet ./...

      - name: Run Go Unit Tests
        run: |
          cd bot_dialog_generator
          go test -v -race ./...

      - name: Run studio-api Tests on PostgreSQL
        env:
          STUDIO_TEST_STORE: postgres
        run: |
          cd bot_dialog_generator
          go test -v -race -count=1 ./services/studio-api/...

  web-apps:
    name: TypeScript Contracts & Web Apps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Build TypeScript Contracts
        run: |
          cd bot_dialog_generator/libs/ts/contracts
          npm install
          npm run build

      - name: Test and Build Studio Web
        run: |
          cd bot_dialog_generator/apps/studio-web
          npm install
          npm test --if-present
          npm run build

      - name: Test and Build Webchat Widget
        run: |
          cd bot_dialog_generator/apps/webchat-widget
          npm install
          npm test --if-present
          npm run build

  e2e:
    name: Playwright End-to-End Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: bot_dialog_generator/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: |
          cd bot_dialog_generator/libs/ts/contracts && npm install && npm run build
          cd ../../../apps/studio-web && npm install
          cd ../webchat-widget && npm install
          cd ../../tests/e2e && npm install
          npx playwright install --with-deps chromium

      - name: Run Playwright Tests
        run: |
          cd bot_dialog_generator/tests/e2e
          npx playwright test

  container-checks:
    name: Local Compose & Containers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Docker Compose Configuration
        run: |
          cd bot_dialog_generator/infra/local
          docker compose config

      - name: Build Bot_Dialog_Generator Fakes Image
        run: |
          docker build -t bot-dialog-generator-fakes:local -f bot_dialog_generator/tests/fakes/Dockerfile bot_dialog_generator
