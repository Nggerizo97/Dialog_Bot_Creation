name: Bot_Dialog_Generator CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contracts-and-backend:
    name: Contracts & Go Services
    runs-on: ubuntu-latest
    services:
      # Real PostgreSQL for the row-level security tests and the studio-api suite.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bdg_owner
          POSTGRES_PASSWORD: bdg_owner_ci
          POSTGRES_DB: bot_dialog_generator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bdg_owner"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://bdg_owner:bdg_owner_ci@localhost:5432/postgres?sslmode=disable
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: bot_dialog_generator/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.47.2'

      - name: Buf Lint
        run: |
          cd bot_dialog_generator
          buf lint

      - name: Verify Code Generation
        run: |
          cd bot_dialog_generator
          buf generate
          git diff --exit-code libs/

      - name: Verify Formatting (gofmt)
        run: |
          cd bot_dialog_generator
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Go Vet
        run: |
          cd bot_dialog_generator
          go vet ./...

      - name: Run Go Unit Tests
        run: |
          cd bot_dialog_generator
          go test -v -race ./...

      - name: Run studio-api Tests on PostgreSQL
        env:
          STUDIO_TEST_STORE: postgres
        run: |
          cd bot_dialog_generator
          go test -v -race -count=1 ./services/studio-api/...

  cognito-emulator:
    # Local Cognito (docs/cognito-setup.md): bootstraps a user pool in the AWS Emulator,
    # signs every demo user in and verifies their tokens with studio-api's verifier.
    name: Cognito on the AWS Emulator
    runs-on: ubuntu-latest
    env:
      EMULATOR_TELEMETRY: "off"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: bot_dialog_generator/go.sum

      - name: Install AWS Emulator (signature checked)
        run: |
          base=https://downloads.aws.com/aws-emulator/packages/aws-emulator/LTS/latest
          curl -fsSLO "$base/aws-emulator_amd64.deb"
          curl -fsSLO "$base/aws-emulator_amd64.deb.sig"
          curl -fsSL https://downloads.aws.com/keys/gpg/current.asc | gpg --import
          gpg --fingerprint ssm-publishing@amazon.com | tr -d ' ' | grep -q 98BCF336A3BE53B734E967C52E5BF49BD940F624
          gpg --verify aws-emulator_amd64.deb.sig aws-emulator_amd64.deb
          sudo apt-get install -y ./aws-emulator_amd64.deb
          aws-emulator -v

      - name: Start AWS Emulator
        run: |
          aws-emulator --telemetry off --idle-timeout 1800 > emulator.log 2>&1 &
          for i in $(seq 30); do
            curl -sf --cacert ~/.aws/emulator/9297/ca.pem https://127.0.0.1:9297/__admin/health && break
            sleep 1
          done

      - name: Bootstrap Cognito and verify tokens
        run: |
          cd bot_dialog_generator
          unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_PROFILE
          export AWS_ENDPOINT_URL=https://127.0.0.1:9297
          export AWS_SHARED_CREDENTIALS_FILE=~/.aws/emulator/9297/emulator_credentials
          export AWS_CONFIG_FILE=~/.aws/emulator/9297/config
          export AWS_CA_BUNDLE=$HOME/.aws/emulator/9297/ca.pem
          export AWS_EC2_METADATA_DISABLED=true AWS_REGION=us-east-1
          COGNITO_EMULATOR_TEST=1 go test -v -count=1 ./tools/cognito-local/
          go run ./tools/cognito-local

  web-apps:
    name: TypeScript Contracts & Web Apps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Build TypeScript Contracts
        run: |
          cd bot_dialog_generator/libs/ts/contracts
          npm install
          npm run build

      - name: Test and Build Studio Web
        run: |
          cd bot_dialog_generator/apps/studio-web
          npm install
          npm test --if-present
          npm run build

      - name: Test and Build Webchat Widget
        run: |
          cd bot_dialog_generator/apps/webchat-widget
          npm install
          npm test --if-present
          npm run build

  e2e:
    name: Playwright End-to-End Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: bot_dialog_generator/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: |
          cd bot_dialog_generator/libs/ts/contracts && npm install && npm run build
          cd ../../../apps/studio-web && npm install
          cd ../webchat-widget && npm install
          cd ../../tests/e2e && npm install
          npx playwright install --with-deps chromium

      - name: Run Playwright Tests
        run: |
          cd bot_dialog_generator/tests/e2e
          npx playwright test

  container-checks:
    name: Local Compose & Containers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Docker Compose Configuration
        run: |
          cd bot_dialog_generator/infra/local
          docker compose config

      - name: Build Bot_Dialog_Generator Fakes Image
        run: |
          docker build -t bot-dialog-generator-fakes:local -f bot_dialog_generator/tests/fakes/Dockerfile bot_dialog_generator
