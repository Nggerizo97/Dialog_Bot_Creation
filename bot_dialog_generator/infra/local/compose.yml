services:
  floci:
    image: floci/floci:latest
    ports:
      - "4566:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
  fakes:
    image: bot-dialog-generator-fakes:local
    profiles: ["fakes"]
    build:
      context: ../..
      dockerfile: tests/fakes/Dockerfile
    ports:
      - "8090:8090"