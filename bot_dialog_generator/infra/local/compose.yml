services:
  # PostgreSQL for studio-api, on host port 5433 so it never clashes with a PostgreSQL
  # installed on the machine. Connection for the app (no table ownership, so
  # row-level security applies): postgres://studio_api:studio_api_local@localhost:5433/bot_dialog_generator
  postgres:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_USER: bdg_owner
      POSTGRES_PASSWORD: bdg_owner_local
      POSTGRES_DB: bot_dialog_generator
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bdg_owner -d bot_dialog_generator"]
      interval: 5s
      timeout: 3s
      retries: 10
  floci:
    image: floci/floci:latest
    ports:
      - "4566:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
  # Local Amazon Cognito (docs/cognito-setup.md): podman compose --profile cognito up aws-emulator
  # Port published on 127.0.0.1 only, as the AWS Emulator guide requires. Its credentials,
  # config and ca.pem appear in ~/.aws/emulator/9297 on this machine (on Windows,
  # set EMULATOR_DIR=%USERPROFILE%\.aws\emulator first).
  aws-emulator:
    image: aws-emulator:local
    profiles: ["cognito"]
    build:
      context: aws-emulator
    command: ["-p", "9297"]
    environment:
      EMULATOR_TELEMETRY: "off"
    mem_limit: 2g
    memswap_limit: 2g
    ports:
      - "127.0.0.1:9297:9297"
    volumes:
      - ${EMULATOR_DIR:-~/.aws/emulator}:/home/emulator/.aws/emulator
  fakes:
    image: bot-dialog-generator-fakes:local
    profiles: ["fakes"]
    build:
      context: ../..
      dockerfile: tests/fakes/Dockerfile
    ports:
      - "8090:8090"

volumes:
  postgres-data:
